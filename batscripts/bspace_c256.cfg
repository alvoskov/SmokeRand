# Birthday spacings tests (lambda = 256) from the `full` battery
# That variants may be more sensitive to some PRNGs artefacts, e.g. grube73_mrg2
battery name=bspace_c256.cfg end

bspace64_1d_c256      test=bspace_nd nbits_per_dim=64 ndims=1 nsamples=12  get_lower=1 lambda=256 end
bspace32_2d_c256      test=bspace_nd nbits_per_dim=32 ndims=2 nsamples=12  get_lower=1 lambda=256 end
bspace32_2d_c256_high test=bspace_nd nbits_per_dim=32 ndims=2 nsamples=12  get_lower=0 lambda=256 end
bspace21_3d_c256      test=bspace_nd nbits_per_dim=21 ndims=3 nsamples=12  get_lower=1 lambda=256 end
bspace21_3d_c256_high test=bspace_nd nbits_per_dim=21 ndims=3 nsamples=12  get_lower=0 lambda=256 end
bspace16_4d_c256      test=bspace_nd nbits_per_dim=16 ndims=4 nsamples=12  get_lower=1 lambda=256 end
bspace16_4d_c256_high test=bspace_nd nbits_per_dim=16 ndims=4 nsamples=12  get_lower=0 lambda=256 end
bspace8_8d_c256       test=bspace_nd nbits_per_dim=8  ndims=8 nsamples=12  get_lower=1 lambda=256 end
bspace8_8d_c256_high  test=bspace_nd nbits_per_dim=8  ndims=8 nsamples=12  get_lower=0 lambda=256 end
bspace4_16d_c256      test=bspace_nd nbits_per_dim=4  ndims=16 nsamples=12 get_lower=1 lambda=256 end
bspace4_16d_c256_high test=bspace_nd nbits_per_dim=4  ndims=16 nsamples=12 get_lower=0 lambda=256 end
